<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>SilverModManager</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#444b55"/>
      <stop offset="1" stop-color="#23272d"/>
    </linearGradient>
    <linearGradient id="faceL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#aeb4bd"/>
    </linearGradient>
    <linearGradient id="faceR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ced5"/>
      <stop offset="1" stop-color="#7f8691"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#tile)"/>
  <!-- glass rim: inset stroke so the tile has an edge on dark panels -->
  <rect x="39" y="39" width="434" height="434" rx="101" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6"/>

  <!-- head is scaled 0.9 around (256,262) so the ear tips sit ~45 inside the tile edge -->
  <!-- left half of head (lit side): blunt outer ear tip, deep notch between ears -->
  <polygon points="81,91 123,86 209,190 256,239 256,433 94,287" fill="url(#faceL)"/>
  <!-- right half of head (shadow side) -->
  <polygon points="431,91 389,86 303,190 256,239 256,433 418,287" fill="url(#faceR)"/>
  <!-- forehead facet -->
  <polygon points="209,190 303,190 256,239" fill="#eef0f3"/>
  <!-- specular facet: a sliver along the left ear's outer edge, reads as a metal highlight -->
  <polygon points="86,97 121,90 203,183 182,190" fill="#ffffff" fill-opacity="0.8"/>

  <!-- inner ears: one step darker than their plane so they read as shading, not holes -->
  <polygon points="116,134 170,194 121,217" fill="#8a909a"/>
  <polygon points="396,134 342,194 391,217" fill="#737984"/>

  <!-- muzzle / mask (white frosting) -->
  <polygon points="256,296 317,334 256,433 195,334" fill="#f6f7f9"/>

  <!-- eyes: slanted almonds, outer corner up, thick enough in the middle to keep a dark pixel at 16px -->
  <polygon points="148,266 192,256 226,286 184,288" fill="#1f2328"/>
  <polygon points="364,266 320,256 286,286 328,288" fill="#1f2328"/>

  <!-- nose -->
  <polygon points="229,361 283,361 256,401" fill="#1f2328"/>
</svg>
