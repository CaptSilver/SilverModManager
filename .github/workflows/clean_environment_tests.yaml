name: Clean Environment Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/clean_environment_tests.yaml"
      - "src/**"
      - "tests/**"
      - "**.props"
      - "**.targets"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/clean_environment_tests.yaml"
      - "src/**"
      - "tests/**"
      - "**.props"
      - "**.targets"
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  draft:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Fails because it's a draft PR
        run: exit 1

  build-and-test:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # Test hosts write .desktop files and mimeapps entries under the XDG dirs; keep that
      # out of the runner's real profile (same isolation as scripts/test.sh).
      XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
      XDG_CONFIG_HOME: ${{ runner.temp }}/xdg/config
      XDG_STATE_HOME: ${{ runner.temp }}/xdg/state
      XDG_CACHE_HOME: ${{ runner.temp }}/xdg/cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore NexusMods.App.sln

      - name: Build
        run: dotnet build NexusMods.App.sln --no-restore

      # Same filters as scripts/test.sh: the offline suite only. Exit code 8 means a project
      # ran zero tests (helpers, or everything filtered out), which is not a failure.
      - name: Test
        run: >
          dotnet test --solution NexusMods.App.sln --no-build --ignore-exit-code 8
          -p:XunitArgs="--report-github --timeout 20m --filter-not-trait RequiresNetworking=True --filter-not-trait RequiresApiKey=True --filter-not-trait FlakeyTest=True"
