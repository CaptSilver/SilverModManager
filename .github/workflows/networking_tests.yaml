name: Networking Tests

on:
  workflow_dispatch:
  push:

jobs:
  build:
    
    name: Test Networking
    runs-on: [self-hosted]
    
    environment: test
    
    env:
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
      # Test hosts write .desktop files and mimeapps entries under the XDG dirs; this runner is
      # self-hosted, so keep that out of its real profile (same isolation as scripts/test.sh).
      XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
      XDG_CONFIG_HOME: ${{ runner.temp }}/xdg/config
      XDG_STATE_HOME: ${{ runner.temp }}/xdg/state
      XDG_CACHE_HOME: ${{ runner.temp }}/xdg/cache

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"
          lfs: true

      - name: Print debug info
        run: dotnet --info

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # The filter travels as an MSBuild property (see tests/Directory.Build.props).
      # Exit code 8 (zero tests ran) is not a failure.
      - name: Tests
        run: >
          dotnet test --solution NexusMods.App.sln --no-build --ignore-exit-code 8
          -p:XunitArgs="--report-github --timeout 20m --filter-trait RequiresNetworking=True"



