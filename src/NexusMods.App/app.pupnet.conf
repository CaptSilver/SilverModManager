# PUPNET DEPLOY: 1.6.0

# PupNet automatically finds this file https://github.com/kuiperzone/PupNet-Deploy?tab=readme-ov-file#introduction-
# if it is in the current working directory.

# Reference Config: https://raw.githubusercontent.com/kuiperzone/PupNet-HelloWorld/main/HelloWorld.pupnet.conf

# APP PREAMBLE
AppBaseName = SilverModManager
AppFriendlyName = SilverModManager
AppId = io.github.CaptSilver.SilverModManager
AppVersionRelease = 1.0.0[1]
AppShortSummary = A Linux mod manager for your games.
AppDescription = """"""
AppLicenseId =  GPL-3.0-only
AppLicenseFile =
AppChangeFile =

# PUBLISHER
PublisherName = CaptSilver
PublisherCopyright = Copyright (C) SilverModManager contributors
PublisherLinkName = Home Page
PublisherLinkUrl = https://github.com/CaptSilver/SilverModManager
PublisherEmail =

# DESKTOP INTEGRATION
DesktopNoDisplay = false
DesktopTerminal = false
DesktopFile = io.github.CaptSilver.SilverModManager.desktop
MetaFile = io.github.CaptSilver.SilverModManager.metainfo.xml
IconFiles = """
    icon.svg
"""

# DOTNET PUBLISH
DotnetProjectPath =
DotnetPublishArgs = -p:Version=${APP_VERSION} --self-contained true -c Release -p:TieredCompilation=true -p:PublishReadyToRun=true -p:PublishSingleFile=true
DotnetPostPublish =

# PACKAGE OUTPUT
PackageName = SilverModManager
OutputDirectory = Deploy/OUT

# APPIMAGE OPTIONS
AppImageArgs = --no-appstream
AppImageVersionOutput = false

# Unused, but PupNet rejects the file without them for every package kind
# (FlatpakPlatform* and SetupMinWindowsVersion are mandatory keys).
FlatpakPlatformRuntime = org.freedesktop.Platform
FlatpakPlatformSdk = org.freedesktop.Sdk
FlatpakPlatformVersion = 23.08
SetupMinWindowsVersion = 10
